<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Playlist Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Music Playlist Manager</h1>
        <p>Manage your songs and playlist</p>
    </header>
    <main>
        <section class="add-song-section">
            <h2>Add New Song</h2>
            <form id="songForm">
                <div class="form-group">
                    <label for="songTitle">Song Name</label>
                    <input
                        type="text"
                        id="songTitle"
                        placeholder="Enter song name">
                </div>
                <div class="form-group">
                    <label for="artist">Artist</label>
                    <input
                        type="text"
                        id="artist"
                        placeholder="Enter artist name">
                </div>
                <div class="form-group">
                    <label for="duration">Duration</label>
                    <input
                        type="text"
                        id="duration"
                        placeholder="Example: 4:25">
                </div>
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre">
                        <option value="">Select Genre</option>
                        <option value="Kannada">Kannada</option>
                        <option value="Hindi">Hindi</option>
                        <option value="English">English</option>
                        <option value="Tamil">Tamil</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit">+ Add Song</button>
            </form>
        </section>
        <section class="playlist-section">
            <h2>My Playlist</h2>
            <div id="emptyMessage">
                <p>Your playlist is empty.</p>
                <p>Add your first song to get started!</p>
            </div>
            <div id="playlistContainer"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
